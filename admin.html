<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Teti Tour | Admin</title>

<style>

/* =========================================================
   GENERAL
   ========================================================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#f4eee4;
color:#33251b;
padding:30px 15px;
}

.admin-box{
max-width:1000px;
margin:30px auto;
background:white;
padding:30px;
border-radius:12px;
box-shadow:0 15px 40px rgba(0,0,0,.12);
}

h1{
margin-bottom:10px;
}

.subtitle{
color:#75675b;
margin-bottom:30px;
}

.login-box{
max-width:450px;
margin:50px auto;
}

label{
display:block;
font-weight:bold;
margin-bottom:7px;
}

input{
width:100%;
padding:13px;
border:1px solid #d5c8b8;
border-radius:5px;
margin-bottom:18px;
font-size:15px;
}

button{
border:none;
padding:13px 20px;
border-radius:5px;
background:#2a1d15;
color:white;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#b38b52;
}

.error{
color:#a33;
margin-top:12px;
font-weight:bold;
}

.success-message{
color:#52733f;
margin-top:15px;
font-weight:bold;
}

.admin-content{
display:none;
}

.reset-box{
display:none;
max-width:450px;
margin:50px auto;
}

.price-list{
margin-top:25px;
overflow-x:auto;
}

.price-row{
display:grid;
grid-template-columns:1.5fr 1fr 1fr 1fr;
gap:10px;
align-items:center;
padding:14px 0;
border-bottom:1px solid #e5ddd2;
}

.price-row input{
margin:0;
}

.save{
width:100%;
margin-top:25px;
}

.logout{
float:right;
background:#777;
}

.logout:hover{
background:#555;
}

.loading{
padding:20px 0;
}

@media(max-width:700px){

.price-row{
grid-template-columns:1fr;
gap:8px;
}

.logout{
float:none;
margin-bottom:20px;
}

}

</style>

</head>


<body>


<div class="admin-box">


<!-- =========================================================
     LOGIN
     ========================================================= -->

<div
class="login-box"
id="loginBox">

<h1>
Teti Tour Admin
</h1>

<p class="subtitle">
Admin login
</p>


<label>
Email
</label>

<input
type="email"
id="email"
placeholder="Admin email"
autocomplete="email">


<label>
Password
</label>

<input
type="password"
id="password"
placeholder="Password"
autocomplete="current-password">


<button
type="button"
onclick="login()">

Login

</button>


<div
class="error"
id="loginError">
</div>

</div>



<!-- =========================================================
     RESET PASSWORD
     ========================================================= -->

<div
class="reset-box"
id="resetBox">

<h1>
Reset Password
</h1>

<p class="subtitle">
Choose your new admin password.
</p>


<label>
New Password
</label>

<input
type="password"
id="newPassword"
placeholder="New password"
autocomplete="new-password">


<label>
Confirm Password
</label>

<input
type="password"
id="confirmPassword"
placeholder="Confirm password"
autocomplete="new-password">


<button
type="button"
onclick="updatePassword()">

Update Password

</button>


<div
class="error"
id="resetError">
</div>


<div
class="success-message"
id="resetSuccess">
</div>

</div>



<!-- =========================================================
     ADMIN CONTENT
     ========================================================= -->

<div
class="admin-content"
id="adminContent">


<button
class="logout"
type="button"
onclick="logout()">

Logout

</button>


<h1>
Teti Tour Price List
</h1>

<p class="subtitle">
Manage your tour prices.
</p>


<div
class="price-list"
id="priceList">

<div class="loading">
Loading prices...
</div>

</div>


</div>


</div>



<script>

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
"https://rzwzkndabcmiyuzzwnts.supabase.co";

const SUPABASE_KEY =
"sb_publishable_oQXE8doEKIJeFK7KLUm3kQ_H_gDhERh";


/* =========================================================
   HELPERS
   ========================================================= */

function getTourId(row){

return String(
row.Tour_id ??
row.tour_id ??
""
).trim();

}


function getTourName(row){

return row.Tour_name ??
row.tour_name ??
getTourId(row);

}


/* =========================================================
   SHOW ADMIN
   ========================================================= */

function showAdmin(){

document.getElementById(
"loginBox"
).style.display =
"none";

document.getElementById(
"resetBox"
).style.display =
"none";

document.getElementById(
"adminContent"
).style.display =
"block";

loadPrices();

}


/* =========================================================
   LOGIN
   ========================================================= */

async function login(){

const email =
document.getElementById(
"email"
).value.trim();

const password =
document.getElementById(
"password"
).value;

const error =
document.getElementById(
"loginError"
);

error.textContent = "";


if(!email || !password){

error.textContent =
"Please enter email and password.";

return;

}


try{

const response =
await fetch(

SUPABASE_URL +
"/auth/v1/token?grant_type=password",

{

method:"POST",

headers:{

"apikey":
SUPABASE_KEY,

"Content-Type":
"application/json"

},

body:JSON.stringify({

email:email,

password:password

})

}

);


const data =
await response.json();


if(!response.ok){

throw new Error(

data.error_description ||
data.msg ||
"Invalid login credentials."

);

}


/* Save session */

localStorage.setItem(
"teti_admin_access_token",
data.access_token
);

localStorage.setItem(
"teti_admin_refresh_token",
data.refresh_token
);

localStorage.setItem(
"teti_admin_email",
email
);


/* Show admin */

showAdmin();

}

catch(error){

console.error(error);

errorMessage(
"loginError",
error.message ||
"Login failed."
);

}

}


/* =========================================================
   ERROR HELPER
   ========================================================= */

function errorMessage(
elementId,
message
){

const element =
document.getElementById(
elementId
);

if(element){

element.textContent =
message;

}

}


/* =========================================================
   PASSWORD RESET
   ========================================================= */

async function updatePassword(){

const newPassword =
document.getElementById(
"newPassword"
).value;

const confirmPassword =
document.getElementById(
"confirmPassword"
).value;

const error =
document.getElementById(
"resetError"
);

const success =
document.getElementById(
"resetSuccess"
);


error.textContent = "";
success.textContent = "";


if(!newPassword || !confirmPassword){

error.textContent =
"Please enter and confirm your new password.";

return;

}


if(newPassword !== confirmPassword){

error.textContent =
"Passwords do not match.";

return;

}


if(newPassword.length < 6){

error.textContent =
"Password must be at least 6 characters.";

return;

}


/*
Supabase password recovery puts
the recovery access token in the URL hash.
*/

const hash =
window.location.hash;

const params =
new URLSearchParams(
hash.substring(1)
);

const accessToken =
params.get(
"access_token"
);


if(!accessToken){

error.textContent =
"Password reset session is missing or expired. Please request a new reset email.";

return;

}


try{

const response =
await fetch(

SUPABASE_URL +
"/auth/v1/user",

{

method:"PUT",

headers:{

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " +
accessToken,

"Content-Type":
"application/json"

},

body:JSON.stringify({

password:
newPassword

})

}

);


const data =
await response.json();


if(!response.ok){

throw new Error(

data.msg ||
data.message ||
data.error_description ||
"Could not update password."

);

}


/*
Password changed successfully.
*/

success.textContent =
"Password updated successfully!";


/*
Remove recovery information
from the URL.
*/

window.history.replaceState(
{},
document.title,
window.location.pathname
);


/*
Wait a moment then show login.
*/

setTimeout(

function(){

document.getElementById(
"resetBox"
).style.display =
"none";

document.getElementById(
"loginBox"
).style.display =
"block";

document.getElementById(
"newPassword"
).value =
"";

document.getElementById(
"confirmPassword"
).value =
"";

document.getElementById(
"resetSuccess"
).textContent =
"";

},

1500

);

}

catch(error){

console.error(error);

error.textContent =
error.message ||
"Could not update password.";

}

}


/* =========================================================
   CHECK PASSWORD RECOVERY
   ========================================================= */

function checkPasswordRecovery(){

const hash =
window.location.hash;

if(!hash){

return false;

}


const params =
new URLSearchParams(
hash.substring(1)
);


const type =
params.get("type");

const accessToken =
params.get("access_token");


if(
type === "recovery" &&
accessToken
){

document.getElementById(
"loginBox"
).style.display =
"none";

document.getElementById(
"adminContent"
).style.display =
"none";

document.getElementById(
"resetBox"
).style.display =
"block";

return true;

}


return false;

}


/* =========================================================
   LOGOUT
   ========================================================= */

function logout(){

localStorage.removeItem(
"teti_admin_access_token"
);

localStorage.removeItem(
"teti_admin_refresh_token"
);

localStorage.removeItem(
"teti_admin_email"
);

window.location.href =
"admin.html";

}


/* =========================================================
   LOAD PRICES
   ========================================================= */

async function loadPrices(){

const token =
localStorage.getItem(
"teti_admin_access_token"
);


if(!token){

return;

}


try{

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/tour_prices?select=*&order=Tour_id.asc",

{

method:"GET",

headers:{

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " +
token

}

}

);


if(!response.ok){

const text =
await response.text();

throw new Error(
text ||
"Could not load prices."
);

}


const prices =
await response.json();


renderPrices(prices);

}

catch(error){

console.error(error);

document.getElementById(
"priceList"
).innerHTML =

"<p>Could not load prices.</p>";

}

}


/* =========================================================
   RENDER PRICES
   ========================================================= */

function renderPrices(prices){

const container =
document.getElementById(
"priceList"
);


if(!prices.length){

container.innerHTML =
"<p>No prices available.</p>";

return;

}


let html = `

<div class="price-row">

<strong>
Tour
</strong>

<strong>
1–2 Guests
</strong>

<strong>
3–14 Guests
</strong>

<strong>
15–25 Guests
</strong>

</div>

`;


prices.forEach(
function(tour){

const id =
getTourId(tour);

const name =
getTourName(tour);


html += `

<div class="price-row">

<strong>
${escapeHtml(name)}
</strong>

<input
type="number"
step="0.01"
data-id="${escapeHtml(id)}"
data-field="price_1_2"
value="${tour.price_1_2 ?? ""}">

<input
type="number"
step="0.01"
data-id="${escapeHtml(id)}"
data-field="price_3_14"
value="${tour.price_3_14 ?? ""}">

<input
type="number"
step="0.01"
data-id="${escapeHtml(id)}"
data-field="price_15_25"
value="${tour.price_15_25 ?? ""}">

</div>

`;

});


html += `

<button
class="save"
type="button"
onclick="savePrices()">

Save Prices

</button>

<div
class="success-message"
id="success">

Prices saved successfully.

</div>

`;


container.innerHTML =
html;

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(value){

return String(value)

.replaceAll("&","&amp;")

.replaceAll("<","&lt;")

.replaceAll(">","&gt;")

.replaceAll('"',"&quot;")

.replaceAll("'","&#039;");

}


/* =========================================================
   SAVE PRICES
   ========================================================= */

async function savePrices(){

const token =
localStorage.getItem(
"teti_admin_access_token"
);


if(!token){

alert(
"Please login first."
);

return;

}


const inputs =
document.querySelectorAll(
"#priceList input"
);


const grouped = {};


inputs.forEach(
function(input){

const id =
input.dataset.id;

const field =
input.dataset.field;


if(!grouped[id]){

grouped[id] = {};

}


grouped[id][field] =

input.value === ""

? null

: Number(input.value);

});


try{


for(
const tourId in grouped
){

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/tour_prices?Tour_id=eq." +
encodeURIComponent(tourId),

{

method:"PATCH",

headers:{

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " +
token,

"Content-Type":
"application/json",

"Prefer":
"return=minimal"

},

body:
JSON.stringify(
grouped[tourId]
)

}

);


if(!response.ok){

const text =
await response.text();

throw new Error(

text ||
"Could not save prices."

);

}

}


const success =
document.getElementById(
"success"
);


if(success){

success.style.display =
"block";

setTimeout(

function(){

success.style.display =
"none";

},

2500

);

}

}

catch(error){

console.error(error);

alert(

"Could not save prices.\n\n" +
error.message

);

}

}


/* =========================================================
   PAGE START
   ========================================================= */

window.addEventListener(

"DOMContentLoaded",

function(){

/*
First check if this is a
password recovery link.
*/

if(
checkPasswordRecovery()
){

return;

}


/*
Otherwise check normal login.
*/

const token =
localStorage.getItem(
"teti_admin_access_token"
);


if(token){

showAdmin();

}

}

);

</script>

</body>

</html>
