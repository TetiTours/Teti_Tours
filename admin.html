<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Teti Tour | Admin</title>

<style>

/* =========================================================
   GENERAL
   ========================================================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#f4eee4;
color:#33251b;
padding:30px 15px;
}

.admin-box{
max-width:1000px;
margin:30px auto;
background:white;
padding:30px;
border-radius:12px;
box-shadow:0 15px 40px rgba(0,0,0,.12);
}

h1{
margin-bottom:10px;
}

.subtitle{
color:#75675b;
margin-bottom:30px;
}

.login-box,
.reset-box{
max-width:450px;
margin:50px auto;
}

.reset-box{
display:none;
}

label{
display:block;
font-weight:bold;
margin-bottom:7px;
}

input{
width:100%;
padding:13px;
border:1px solid #d5c8b8;
border-radius:5px;
margin-bottom:18px;
font-size:15px;
}

button{
border:none;
padding:13px 20px;
border-radius:5px;
background:#2a1d15;
color:white;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#b38b52;
}

.error{
color:#a33;
margin-top:12px;
font-weight:bold;
line-height:1.5;
}

.success{
color:#52733f;
margin-top:15px;
font-weight:bold;
line-height:1.5;
}

.admin-content{
display:none;
}

.price-list{
margin-top:25px;
overflow-x:auto;
}

.price-row{
display:grid;
grid-template-columns:1.5fr 1fr 1fr 1fr;
gap:10px;
align-items:center;
padding:14px 0;
border-bottom:1px solid #e5ddd2;
}

.price-row input{
margin:0;
}

.save{
width:100%;
margin-top:25px;
}

.logout{
float:right;
background:#777;
}

.logout:hover{
background:#555;
}

.loading{
padding:20px 0;
color:#75675b;
}

.small-note{
margin-top:15px;
font-size:13px;
color:#75675b;
line-height:1.5;
}

@media(max-width:700px){

.price-row{
grid-template-columns:1fr;
gap:8px;
}

.logout{
float:none;
margin-bottom:20px;
}

}

</style>

</head>


<body>


<div class="admin-box">


<!-- =========================================================
     LOGIN
     ========================================================= -->

<div
class="login-box"
id="loginBox">

<h1>
Teti Tour Admin
</h1>

<p class="subtitle">
Admin login
</p>


<label>
Email
</label>

<input
type="email"
id="email"
placeholder="Admin email"
autocomplete="email">


<label>
Password
</label>

<input
type="password"
id="password"
placeholder="Password"
autocomplete="current-password">


<button
type="button"
id="loginButton">

Login

</button>


<div
class="error"
id="loginError">
</div>


<p class="small-note">
Use your Supabase admin account.
</p>

</div>



<!-- =========================================================
     RESET PASSWORD
     ========================================================= -->

<div
class="reset-box"
id="resetBox">

<h1>
Reset Password
</h1>

<p class="subtitle">
Choose your new admin password.
</p>


<label>
New Password
</label>

<input
type="password"
id="newPassword"
placeholder="New password"
autocomplete="new-password">


<label>
Confirm Password
</label>

<input
type="password"
id="confirmPassword"
placeholder="Confirm password"
autocomplete="new-password">


<button
type="button"
id="updatePasswordButton">

Update Password

</button>


<div
class="error"
id="resetError">
</div>


<div
class="success"
id="resetSuccess">
</div>

</div>



<!-- =========================================================
     ADMIN CONTENT
     ========================================================= -->

<div
class="admin-content"
id="adminContent">


<button
class="logout"
type="button"
id="logoutButton">

Logout

</button>


<h1>
Teti Tour Price List
</h1>

<p class="subtitle">
Manage your tour prices.
</p>


<div
class="price-list"
id="priceList">

<div class="loading">
Loading prices...
</div>

</div>


</div>


</div>



<!-- =========================================================
     SUPABASE JS
     ========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================================================
   SUPABASE CONFIG
   ========================================================= */

const SUPABASE_URL =
"https://rzwzkndabcmiyuzzwnts.supabase.co";

const SUPABASE_KEY =
"sb_publishable_oQXE8doEKIJeFK7KLUm3kQ_H_gDhERh";


const {
createClient
} = window.supabase;


const supabase =
createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================================================
   DOM
   ========================================================= */

const loginBox =
document.getElementById(
"loginBox"
);

const resetBox =
document.getElementById(
"resetBox"
);

const adminContent =
document.getElementById(
"adminContent"
);

const loginError =
document.getElementById(
"loginError"
);

const resetError =
document.getElementById(
"resetError"
);

const resetSuccess =
document.getElementById(
"resetSuccess"
);

const priceList =
document.getElementById(
"priceList"
);


/* =========================================================
   HELPERS
   ========================================================= */

function getTourId(row){

return String(
row.Tour_id ??
row.tour_id ??
""
).trim();

}


function getTourName(row){

return (
row.Tour_name ??
row.tour_name ??
getTourId(row)
);

}


function escapeHtml(value){

return String(value)

.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* =========================================================
   SHOW / HIDE
   ========================================================= */

function showLogin(){

loginBox.style.display =
"block";

resetBox.style.display =
"none";

adminContent.style.display =
"none";

}


function showReset(){

loginBox.style.display =
"none";

resetBox.style.display =
"block";

adminContent.style.display =
"none";

}


function showAdmin(){

loginBox.style.display =
"none";

resetBox.style.display =
"none";

adminContent.style.display =
"block";

loadPrices();

}


/* =========================================================
   NORMAL LOGIN
   ========================================================= */

async function login(){

loginError.textContent = "";

const email =
document.getElementById(
"email"
).value.trim();

const password =
document.getElementById(
"password"
).value;


if(!email || !password){

loginError.textContent =
"Please enter your email and password.";

return;

}


try{

const {
data,
error
} =
await supabase.auth.signInWithPassword({

email:email,

password:password

});


if(error){

throw error;

}


if(!data.session){

throw new Error(
"Login succeeded but no session was created."
);

}


showAdmin();

}

catch(error){

console.error(
"LOGIN ERROR:",
error
);

loginError.textContent =
error.message ||
"Invalid login credentials.";

}

}


/* =========================================================
   PASSWORD UPDATE
   ========================================================= */

async function updatePassword(){

resetError.textContent =
"";

resetSuccess.textContent =
"";


const newPassword =
document.getElementById(
"newPassword"
).value;

const confirmPassword =
document.getElementById(
"confirmPassword"
).value;


if(!newPassword || !confirmPassword){

resetError.textContent =
"Please enter and confirm your new password.";

return;

}


if(newPassword !== confirmPassword){

resetError.textContent =
"Passwords do not match.";

return;

}


if(newPassword.length < 6){

resetError.textContent =
"Password must be at least 6 characters.";

return;

}


try{

/*
Supabase has already created the recovery
session when the reset link is opened.
*/

const {
data: {
user
},
error
} =
await supabase.auth.updateUser({

password:newPassword

});


if(error){

throw error;

}


if(!user){

throw new Error(
"Password could not be updated."
);

}


resetSuccess.textContent =
"Password updated successfully.";


/*
Clear form
*/

document.getElementById(
"newPassword"
).value =
"";

document.getElementById(
"confirmPassword"
).value =
"";


/*
Remove recovery parameters
from the browser URL.
*/

window.history.replaceState(
{},
document.title,
window.location.pathname
);


/*
Show login after a short delay.
*/

setTimeout(

function(){

showLogin();

},

1500

);

}

catch(error){

console.error(
"UPDATE PASSWORD ERROR:",
error
);

resetError.textContent =
error.message ||
"Could not update password.";

}

}


/* =========================================================
   LOGOUT
   ========================================================= */

async function logout(){

await supabase.auth.signOut();

showLogin();

}


/* =========================================================
   LOAD PRICES
   ========================================================= */

async function loadPrices(){

priceList.innerHTML =

'<div class="loading">Loading prices...</div>';


try{

const {
data: {
session
}
} =
await supabase.auth.getSession();


if(!session){

showLogin();

return;

}


const response =
await fetch(

SUPABASE_URL +
"/rest/v1/tour_prices?select=*&order=Tour_id.asc",

{

method:"GET",

headers:{

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " +
session.access_token,

"Content-Type":
"application/json"

}

}

);


if(!response.ok){

const text =
await response.text();

throw new Error(
text ||
"Could not load prices."
);

}


const prices =
await response.json();


renderPrices(prices);

}

catch(error){

console.error(
"LOAD PRICES ERROR:",
error
);

priceList.innerHTML =

'<div class="error">' +
"Could not load prices." +
"</div>";

}

}


/* =========================================================
   RENDER PRICES
   ========================================================= */

function renderPrices(prices){

if(
!Array.isArray(prices) ||
prices.length === 0
){

priceList.innerHTML =
"<p>No prices available.</p>";

return;

}


let html = `

<div class="price-row">

<strong>
Tour
</strong>

<strong>
1–2 Guests
</strong>

<strong>
3–14 Guests
</strong>

<strong>
15–25 Guests
</strong>

</div>

`;


prices.forEach(
function(tour){

const id =
getTourId(tour);

const name =
getTourName(tour);


html += `

<div class="price-row">

<strong>
${escapeHtml(name)}
</strong>

<input
type="number"
step="0.01"
data-id="${escapeHtml(id)}"
data-field="price_1_2"
value="${tour.price_1_2 ?? ""}">

<input
type="number"
step="0.01"
data-id="${escapeHtml(id)}"
data-field="price_3_14"
value="${tour.price_3_14 ?? ""}">

<input
type="number"
step="0.01"
data-id="${escapeHtml(id)}"
data-field="price_15_25"
value="${tour.price_15_25 ?? ""}">

</div>

`;

});


html += `

<button
class="save"
type="button"
id="savePricesButton">

Save Prices

</button>

<div
class="success"
id="saveSuccess">
</div>

`;


priceList.innerHTML =
html;


document
.getElementById(
"savePricesButton"
)
.addEventListener(
"click",
savePrices
);

}


/* =========================================================
   SAVE PRICES
   ========================================================= */

async function savePrices(){

const saveSuccess =
document.getElementById(
"saveSuccess"
);

saveSuccess.textContent =
"";


try{

const {
data: {
session
}
} =
await supabase.auth.getSession();


if(!session){

throw new Error(
"Your session has expired. Please login again."
);

}


const inputs =
document.querySelectorAll(
"#priceList input"
);


const grouped = {};


inputs.forEach(
function(input){

const id =
input.dataset.id;

const field =
input.dataset.field;


if(!grouped[id]){

grouped[id] = {};

}


grouped[id][field] =
input.value === ""
? null
: Number(input.value);

});


for(
const tourId in grouped
){

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/tour_prices?Tour_id=eq." +
encodeURIComponent(tourId),

{

method:"PATCH",

headers:{

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " +
session.access_token,

"Content-Type":
"application/json",

"Prefer":
"return=minimal"

},

body:
JSON.stringify(
grouped[tourId]
)

}

);


if(!response.ok){

const text =
await response.text();

throw new Error(
text ||
"Could not save prices."
);

}

}


saveSuccess.textContent =
"Prices saved successfully.";

setTimeout(
function(){

saveSuccess.textContent =
"";

},
2500
);

}

catch(error){

console.error(
"SAVE PRICES ERROR:",
error
);

alert(
"Could not save prices.\n\n" +
error.message
);

}

}


/* =========================================================
   AUTH STATE
   ========================================================= */

supabase.auth.onAuthStateChange(

function(event, session){

console.log(
"AUTH EVENT:",
event
);


/*
When Supabase returns the user
from a recovery link.
*/

if(
event === "PASSWORD_RECOVERY"
){

showReset();

return;

}


/*
Normal signed-in session.
*/

if(
session &&
event !== "SIGNED_OUT"
){

/*
Do not immediately override
the reset screen.
*/

if(
resetBox.style.display !== "block"
){

showAdmin();

}

return;

}


/*
Signed out.
*/

if(
event === "SIGNED_OUT"
){

showLogin();

}

});


/* =========================================================
   INITIALIZE
   ========================================================= */

async function initialize(){

try{

/*
If the URL contains ?code=...
Supabase needs to exchange that
code for a session.
*/

const url =
new URL(
window.location.href
);

const code =
url.searchParams.get(
"code"
);


if(code){

const {
data,
error
} =
await supabase.auth.exchangeCodeForSession(
code
);


if(error){

throw error;

}


if(data.session){

showReset();

/*
Remove ?code from URL.
*/

window.history.replaceState(
{},
document.title,
window.location.pathname
);

return;

}

}


/*
Check current session.
*/

const {
data: {
session
},
error
} =
await supabase.auth.getSession();


if(error){

throw error;

}


if(session){

/*
If we're returning from a
recovery flow, show reset.
*/

const recovery =
window.location.hash
.includes(
"type=recovery"
);


if(recovery){

showReset();

}

else{

showAdmin();

}

}

else{

showLogin();

}

}

catch(error){

console.error(
"INITIALIZE ERROR:",
error
);

showLogin();

}

}


/* =========================================================
   BUTTON EVENTS
   ========================================================= */

document
.getElementById(
"loginButton"
)
.addEventListener(
"click",
login
);


document
.getElementById(
"updatePasswordButton"
)
.addEventListener(
"click",
updatePassword
);


document
.getElementById(
"logoutButton"
)
.addEventListener(
"click",
logout
);


/*
Allow Enter key on login.
*/

document
.getElementById(
"password"
)
.addEventListener(
"keydown",
function(event){

if(
event.key === "Enter"
){

login();

}

});


/*
Allow Enter key on reset.
*/

document
.getElementById(
"confirmPassword"
)
.addEventListener(
"keydown",
function(event){

if(
event.key === "Enter"
){

updatePassword();

}

});


/* START */

initialize();

</script>

</body>

</html>
